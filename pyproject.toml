[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "systemone-gate"
version = "0.1.0"
description = "Ultra-fast local decision gate and triage engine for AI coding agents powered by Ollama System One."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Belicio B Cardoso" }
]
keywords = ["ollama", "systemone", "ai-agents", "mcp", "code-quality", "git-hook", "jev"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/beliciobcardoso/systemone_gate"
Issues = "https://github.com/beliciobcardoso/systemone_gate/issues"

[project.scripts]
systemone-gate = "systemone_gate.cli:main"
systemone-mcp = "systemone_gate.mcp_server:run_mcp_server"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not contract\""
markers = ["contract: roda contra o Ollama real local; opt-in com `pytest -m contract` (pula se indisponível)"]

[tool.coverage.run]
source = ["systemone_gate"]

[tool.coverage.report]
show_missing = true
